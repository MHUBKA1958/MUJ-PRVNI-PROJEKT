<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stopky" />
    <title>Pracovní Stopky</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
      html, body { height:100%; overflow:hidden; }
      body {
        font-family: -apple-system, 'Helvetica Neue', sans-serif;
        background: #0f0f1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        transition: background 0.5s;
      }
      body.alarm { background: #2a0000; }

      .app { display:flex; flex-direction:column; align-items:center; width:100%; padding:32px 20px; }

      h1 {
        color:#fff; opacity:0.35;
        font-size: clamp(0.85rem, 2.5vw, 1.1rem);
        font-weight:300; letter-spacing:6px; text-transform:uppercase;
        margin-bottom: clamp(28px, 6vh, 60px);
      }

      .display {
        font-size: clamp(4.5rem, 17vw, 10rem);
        font-weight:200; color:#fff; letter-spacing:4px;
        font-variant-numeric:tabular-nums; line-height:1;
        margin-bottom:8px; transition:color 0.4s;
      }
      .display.urgent { color:#ff453a; }

      .centis {
        font-size: clamp(1.2rem, 4vw, 2.8rem);
        color:#fff; opacity:0.25; font-weight:200;
        letter-spacing:4px; font-variant-numeric:tabular-nums;
        margin-bottom: clamp(20px, 4vh, 40px);
      }

      .status {
        font-size: clamp(0.7rem, 1.8vw, 0.9rem);
        letter-spacing:4px; text-transform:uppercase; font-weight:400;
        margin-bottom: clamp(20px, 4vh, 40px); height:20px;
      }
      .status.running { color:#30d158; }
      .status.paused  { color:#ff9f0a; }
      .status.idle    { color:#3a3a4a; }
      .status.done    { color:#ff453a; }

      .limit-row {
        display:flex; align-items:center; gap:10px;
        margin-bottom: clamp(20px, 4vh, 40px);
      }
      .limit-label { color:#444; font-size:clamp(0.7rem,1.8vw,0.85rem); letter-spacing:2px; text-transform:uppercase; }
      .num-input {
        background:#1c1c2e; border:1px solid #2a2a3a; border-radius:10px;
        color:#fff; font-size:clamp(1rem,3vw,1.3rem); font-family:inherit;
        font-variant-numeric:tabular-nums; text-align:center;
        width:clamp(50px,10vw,70px); padding:8px 4px;
        -webkit-appearance:none; appearance:none;
      }
      .num-input:focus { outline:none; border-color:#30d158; }
      .sep { color:#444; font-size:clamp(1.1rem,2.5vw,1.4rem); }

      .buttons { display:flex; gap:clamp(14px,4vw,36px); align-items:center; }
      .btn {
        width:clamp(76px,17vw,130px); height:clamp(76px,17vw,130px);
        border:none; border-radius:50%;
        font-size:clamp(0.85rem,2.2vw,1.2rem); font-weight:500;
        cursor:pointer; transition:transform 0.15s, filter 0.15s;
        display:flex; align-items:center; justify-content:center;
      }
      .btn:active { transform:scale(0.92); filter:brightness(0.82); }
      .btn-start { background:#30d158; color:#000; }
      .btn-pause { background:#ff9f0a; color:#000; }
      .btn-reset { background:#1c1c2e; color:#888; border:2px solid #2a2a3a; }

      .alarm-bar {
        position:fixed; top:0; left:0; right:0;
        background:#ff453a; color:#fff; text-align:center;
        padding:18px; font-size:clamp(0.95rem,2.5vw,1.3rem);
        font-weight:600; letter-spacing:2px; text-transform:uppercase;
        animation:blink 1s infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.55} }

      .tip {
        position:fixed; bottom:20px;
        font-size:clamp(0.58rem,1.3vw,0.72rem);
        color:#222; letter-spacing:2px; text-transform:uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">

      var useState = React.useState;
      var useEffect = React.useEffect;
      var useRef = React.useRef;

      function pad(n) { return String(Math.floor(n)).padStart(2,'0'); }

      function beep(ctx) {
        [0, 0.45, 0.9, 1.35, 1.8].forEach(function(t) {
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(880, ctx.currentTime + t);
          o.frequency.setValueAtTime(660, ctx.currentTime + t + 0.15);
          g.gain.setValueAtTime(0.5, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.38);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.38);
        });
      }

      function App() {
        var limitHRef = useRef(2);
        var limitMRef = useRef(0);
        var _h = useState('02'); var limitH = _h[0]; var setLimitH = _h[1];
        var _m = useState('00'); var limitM = _m[0]; var setLimitM = _m[1];
        var _rem = useState(null); var remaining = _rem[0]; var setRemaining = _rem[1];
        var _run = useState(false); var running = _run[0]; var setRunning = _run[1];
        var _done = useState(false); var done = _done[0]; var setDone = _done[1];

        var endTimeRef = useRef(null);
        var audioRef = useRef(null);
        var firedRef = useRef(false);
        var tickRef = useRef(null);

        function totalMs() {
          var h = parseInt(limitH) || 0;
          var m = parseInt(limitM) || 0;
          return (h * 3600 + m * 60) * 1000;
        }

        function fireAlarm() {
          if (firedRef.current) return;
          firedRef.current = true;
          document.body.classList.add('alarm');
          if (audioRef.current) beep(audioRef.current);
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            new Notification('Pracovní Stopky', { body: 'Čas vypršel! Čas si odpočinout.' });
          }
        }

        function tick() {
          var left = endTimeRef.current - Date.now();
          if (left <= 0) {
            clearInterval(tickRef.current);
            setRemaining(0);
            setRunning(false);
            setDone(true);
            fireAlarm();
          } else {
            setRemaining(left);
          }
        }

        useEffect(function() {
          if (running) {
            tickRef.current = setInterval(tick, 100);
          } else {
            clearInterval(tickRef.current);
          }
          return function() { clearInterval(tickRef.current); };
        }, [running]);

        useEffect(function() {
          function onVisible() {
            if (!running || !endTimeRef.current) return;
            var left = endTimeRef.current - Date.now();
            if (left <= 0) {
              clearInterval(tickRef.current);
              setRemaining(0); setRunning(false); setDone(true);
              fireAlarm();
            } else {
              setRemaining(left);
            }
          }
          document.addEventListener('visibilitychange', onVisible);
          return function() { document.removeEventListener('visibilitychange', onVisible); };
        }, [running]);

        function handleStart() {
          if (!audioRef.current) {
            audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
            Notification.requestPermission();
          }
          var ms = remaining !== null ? remaining : totalMs();
          if (ms <= 0) return;
          endTimeRef.current = Date.now() + ms;
          setRemaining(ms);
          firedRef.current = false;
          setDone(false);
          setRunning(true);
        }

        function handlePause() { setRunning(false); }

        function handleReset() {
          clearInterval(tickRef.current);
          setRunning(false); setDone(false); setRemaining(null);
          endTimeRef.current = null; firedRef.current = false;
          document.body.classList.remove('alarm');
        }

        var disp = remaining !== null ? remaining : totalMs();
        var hh = Math.floor(disp / 3600000);
        var mm = Math.floor((disp % 3600000) / 60000);
        var ss = Math.floor((disp % 60000) / 1000);
        var cs = Math.floor((disp % 1000) / 10);

        var urgent = remaining !== null && remaining < 60000 && !done;
        var stCls = done ? 'done' : running ? 'running' : remaining !== null ? 'paused' : 'idle';
        var stTxt = done ? 'Čas vypršel!' : running ? 'Odpočítávám...' : remaining !== null ? 'Pozastaveno' : 'Připraveno';

        return React.createElement(React.Fragment, null,
          done && React.createElement('div', {className:'alarm-bar'}, 'Čas vypršel! Jdi si odpočinout.'),

          React.createElement('div', {className:'app'},
            React.createElement('h1', null, 'Pracovní Stopky'),

            React.createElement('div', {className: urgent ? 'display urgent' : 'display'},
              pad(hh) + ':' + pad(mm) + ':' + pad(ss)
            ),
            React.createElement('div', {className:'centis'}, '.' + pad(cs)),

            React.createElement('div', {className:'status ' + stCls}, stTxt),

            (!running && remaining === null) && React.createElement('div', {className:'limit-row'},
              React.createElement('span', {className:'limit-label'}, 'Limit'),
              React.createElement('input', {
                className:'num-input', type:'number', min:'0', max:'23', value:limitH,
                onChange: function(e){ setLimitH(e.target.value); }
              }),
              React.createElement('span', {className:'sep'}, 'h'),
              React.createElement('input', {
                className:'num-input', type:'number', min:'0', max:'59', value:limitM,
                onChange: function(e){ setLimitM(e.target.value); }
              }),
              React.createElement('span', {className:'sep'}, 'm')
            ),

            React.createElement('div', {className:'buttons'},
              !done && React.createElement('button', {
                className: 'btn ' + (running ? 'btn-pause' : 'btn-start'),
                onClick: running ? handlePause : handleStart
              }, running ? 'Pauza' : 'Start'),

              React.createElement('button', {className:'btn btn-reset', onClick:handleReset}, 'Reset')
            )
          ),

          React.createElement('div', {className:'tip'}, 'Přidej na plochu · povol notifikace')
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
