<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pracovní Stopky</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', sans-serif;
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .app {
        background: #16213e;
        border-radius: 24px;
        padding: 48px 64px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      h1 {
        color: #e0e0e0;
        font-size: 1.2rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 40px;
        opacity: 0.7;
      }

      .display {
        font-size: 5rem;
        font-weight: 700;
        color: #00d4ff;
        letter-spacing: 4px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 16px;
      }

      .milliseconds {
        font-size: 1.8rem;
        color: #00d4ff;
        opacity: 0.5;
        margin-bottom: 48px;
        letter-spacing: 2px;
      }

      .status {
        font-size: 0.85rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 40px;
        height: 20px;
      }

      .status.running { color: #00ff88; }
      .status.paused  { color: #ffaa00; }
      .status.stopped { color: #555; }

      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      button {
        padding: 14px 32px;
        border: none;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 1px;
        transition: transform 0.1s, opacity 0.2s;
      }

      button:active { transform: scale(0.96); }

      .btn-start  { background: #00ff88; color: #0a0a0a; }
      .btn-pause  { background: #ffaa00; color: #0a0a0a; }
      .btn-reset  { background: #2a2a4a; color: #aaa; }
      .btn-reset:hover { background: #3a3a5a; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function Stopwatch() {
        const [elapsed, setElapsed] = useState(0);
        const [running, setRunning] = useState(false);
        const intervalRef = useRef(null);
        const startTimeRef = useRef(null);

        useEffect(() => {
          if (running) {
            startTimeRef.current = Date.now() - elapsed;
            intervalRef.current = setInterval(() => {
              setElapsed(Date.now() - startTimeRef.current);
            }, 10);
          } else {
            clearInterval(intervalRef.current);
          }
          return () => clearInterval(intervalRef.current);
        }, [running]);

        const hours   = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        const millis  = Math.floor((elapsed % 1000) / 10);

        function handleStartPause() {
          setRunning(r => !r);
        }

        function handleReset() {
          setRunning(false);
          setElapsed(0);
        }

        const status = running ? 'running' : elapsed > 0 ? 'paused' : 'stopped';
        const statusText = running ? 'Měříme čas...' : elapsed > 0 ? 'Pozastaveno' : 'Připraveno';

        return (
          <div className="app">
            <h1>Pracovní Stopky</h1>
            <div className="display">
              {pad(hours)}:{pad(minutes)}:{pad(seconds)}
            </div>
            <div className="milliseconds">.{pad(millis)}</div>
            <div className={`status ${status}`}>{statusText}</div>
            <div className="buttons">
              <button
                className={running ? 'btn-pause' : 'btn-start'}
                onClick={handleStartPause}
              >
                {running ? 'Pauza' : 'Start'}
              </button>
              <button className="btn-reset" onClick={handleReset}>
                Reset
              </button>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<Stopwatch />);
    </script>
  </body>
</html>
