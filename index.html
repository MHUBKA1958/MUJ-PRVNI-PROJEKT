<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stopky" />
    <title>Pracovní Stopky</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        background: #0f0f1a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }

      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 40px 20px;
        gap: 0;
      }

      h1 {
        color: #ffffff;
        font-size: clamp(1rem, 3vw, 1.4rem);
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: clamp(40px, 8vh, 80px);
        opacity: 0.5;
      }

      .display {
        font-size: clamp(5rem, 18vw, 11rem);
        font-weight: 200;
        color: #ffffff;
        letter-spacing: 4px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        margin-bottom: 12px;
      }

      .milliseconds {
        font-size: clamp(1.5rem, 5vw, 3.5rem);
        color: #ffffff;
        opacity: 0.3;
        font-weight: 200;
        margin-bottom: clamp(40px, 8vh, 80px);
        letter-spacing: 4px;
        font-variant-numeric: tabular-nums;
      }

      .status {
        font-size: clamp(0.75rem, 2vw, 1rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 400;
        margin-bottom: clamp(40px, 8vh, 80px);
        height: 24px;
        transition: color 0.3s;
      }

      .status.running { color: #30d158; }
      .status.paused  { color: #ff9f0a; }
      .status.stopped { color: #3a3a4a; }

      .buttons {
        display: flex;
        gap: clamp(16px, 4vw, 40px);
        justify-content: center;
        align-items: center;
      }

      .btn-circle {
        width: clamp(80px, 18vw, 140px);
        height: clamp(80px, 18vw, 140px);
        border: none;
        border-radius: 50%;
        font-size: clamp(0.9rem, 2.5vw, 1.3rem);
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 1px;
        transition: transform 0.15s, filter 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-circle:active {
        transform: scale(0.92);
        filter: brightness(0.85);
      }

      .btn-start  { background: #30d158; color: #000; }
      .btn-pause  { background: #ff9f0a; color: #000; }
      .btn-reset  {
        background: #1c1c2e;
        color: #8e8e9a;
        border: 2px solid #2a2a3a;
      }

      .tip {
        position: fixed;
        bottom: 24px;
        font-size: clamp(0.65rem, 1.5vw, 0.8rem);
        color: #3a3a4a;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function Stopwatch() {
        const [elapsed, setElapsed] = useState(0);
        const [running, setRunning] = useState(false);
        const intervalRef = useRef(null);
        const startTimeRef = useRef(null);

        useEffect(() => {
          if (running) {
            startTimeRef.current = Date.now() - elapsed;
            intervalRef.current = setInterval(() => {
              setElapsed(Date.now() - startTimeRef.current);
            }, 10);
          } else {
            clearInterval(intervalRef.current);
          }
          return () => clearInterval(intervalRef.current);
        }, [running]);

        const hours   = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        const millis  = Math.floor((elapsed % 1000) / 10);

        function handleStartPause() {
          setRunning(r => !r);
        }

        function handleReset() {
          setRunning(false);
          setElapsed(0);
        }

        const status = running ? 'running' : elapsed > 0 ? 'paused' : 'stopped';
        const statusText = running ? 'Měříme čas...' : elapsed > 0 ? 'Pozastaveno' : 'Připraveno';

        return (
          <div className="app">
            <h1>Pracovní Stopky</h1>

            <div className="display">
              {pad(hours)}:{pad(minutes)}:{pad(seconds)}
            </div>
            <div className="milliseconds">.{pad(millis)}</div>

            <div className={`status ${status}`}>{statusText}</div>

            <div className="buttons">
              <button
                className={`btn-circle ${running ? 'btn-pause' : 'btn-start'}`}
                onClick={handleStartPause}
              >
                {running ? 'Pauza' : 'Start'}
              </button>
              <button className="btn-circle btn-reset" onClick={handleReset}>
                Reset
              </button>
            </div>

            <div className="tip">Přidej na plochu pro plnou obrazovku</div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<Stopwatch />);
    </script>
  </body>
</html>
